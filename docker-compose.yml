services:
  stash:
    build: .
    image: stash:local
    container_name: stash
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - stash-data:/data
    environment:
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET must be set in .env (generate with: openssl rand -hex 32)}"
      BEHIND_PROXY: ${BEHIND_PROXY:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Amsterdam}

volumes:
  stash-data:
